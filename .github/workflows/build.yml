name: Build and Test Firmware

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository (with submodules)
      uses: actions/checkout@v3
      with:
        submodules: recursive   # <-- this makes sure googletest is cloned

    - name: Install ARM GCC + GTest deps
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi \
                               g++ cmake make libnewlib-arm-none-eabi

    - name: Build googletest
      run: |
        cd external/googletest
        cmake -S . -B build
        cmake --build build

    - name: Build firmware + tests
      run: |
        make clean
        make

    - name: Run unit tests
      run: ./Tests/Bin/test_uart || (echo "Unit tests failed" && exit 1)

    - name: Upload firmware artifacts
      uses: actions/upload-artifact@v4
      with:
        name: firmware
        path: |
          build/**/*.elf
          build/**/*.bin
          build/**/*.hex
          build/**/*.map

    - name: Upload test binary + logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-artifacts
        path: |
          Tests/Bin/test_uart
