name: Build and Test Firmware

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Install ARM GCC + GTest deps
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi \
                               g++ cmake make libnewlib-arm-none-eabi

    - name: Fetch and build googletest
      run: |
        rm -rf Middlewares/googletest   # ensure no stale copy
        mkdir -p Middlewares
        cd Middlewares
        git clone https://github.com/google/googletest.git
        cd googletest
        cmake -S . -B build
        cmake --build build

    - name: Build firmware + tests
      run: |
        make clean
        make

#    - name: Run unit tests (skip if missing)
#      run: |
#        if [ -f ./Tests/Bin/test_uart ] || [ -f ./Tests/Bin/test_uart.exe ]; then
#          echo "Running unit tests..."
#          ./Tests/Bin/test_uart 2>/dev/null || ./Tests/Bin/test_uart.exe
#        else
#          echo "No test binary found, skipping test run"
#        fi

    - name: List Build directory
      run: |
        ls -R Build || true
        ls -R Debug || true
        ls -R Release || true

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: firmware
        path: |
          Build/**/*.elf
          Build/**/*.bin
          Build/**/*.hex
          Build/**/*.map
      

