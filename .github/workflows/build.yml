name: Build and Test Firmware

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Install ARM GCC + GTest deps
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi \
                               g++ cmake make

    - name: Build firmware + tests (default make)
      run: |
        make clean
        make

    - name: Upload firmware artifacts
      uses: actions/upload-artifact@v4
      with:
        name: firmware
        path: |
          build/**/*.elf
          build/**/*.bin
          build/**/*.hex
          build/**/*.map

    - name: Upload test binary + logs
      if: always()   # ensure upload even if tests fail
      uses: actions/upload-artifact@v4
      with:
        name: test-artifacts
        path: |
          Tests/Bin/test_uart.exe
          Tests/uart/*.o
          Tests/*.o
